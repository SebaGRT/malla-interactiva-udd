<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseCard — 8 states</title>
    <link rel="stylesheet" href="../src/styles/malla-grid.css" />
    <style>
      body {
        margin: 0;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      .preview {
        display: grid;
        gap: 1rem;
        max-width: 8rem;
      }
      .preview__row {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .preview__label {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <div class="preview__row">
        <span class="preview__label">default</span>
        <button type="button" class="course-card" style="--course-accent: #1a237e; --course-fg: #fff">
          <span class="course-card__stripe" aria-hidden></span>
          <span class="course-card__surface" aria-hidden></span>
          <header class="course-card__head">
            <span class="course-card__code">IIT118W</span>
            <span class="course-card__category">IIA</span>
          </header>
          <p class="course-card__name">Taller de Programación</p>
          <footer class="course-card__foot">
            <span class="course-card__credits">
              <span class="course-card__credits-value">10</span>
              <span class="course-card__credits-label">cr</span>
            </span>
          </footer>
        </button>
      </div>

      <div class="preview__row">
        <span class="preview__label">hover</span>
        <button type="button" class="course-card is-hover" style="--course-accent: #00bcd4; --course-fg: #222">
          <span class="course-card__stripe" aria-hidden></span>
          <span class="course-card__surface" aria-hidden></span>
          <header class="course-card__head">
            <span class="course-card__code">IID11W</span>
            <span class="course-card__category">GIC</span>
          </header>
          <p class="course-card__name">Desafíos de la Ingeniería</p>
          <footer class="course-card__foot">
            <span class="course-card__credits">
              <span class="course-card__credits-value">8</span>
              <span class="course-card__credits-label">cr</span>
            </span>
          </footer>
        </button>
      </div>

      <div class="preview__row">
        <span class="preview__label">focus</span>
        <button type="button" class="course-card is-focus" style="--course-accent: #78909c; --course-fg: #fff">
          <span class="course-card__stripe" aria-hidden></span>
          <span class="course-card__surface" aria-hidden></span>
          <header class="course-card__head">
            <span class="course-card__code">CBE101</span>
            <span class="course-card__category">CBE</span>
          </header>
          <p class="course-card__name">Cálculo I</p>
          <footer class="course-card__foot">
            <span class="course-card__credits">
              <span class="course-card__credits-value">6</span>
              <span class="course-card__credits-label">cr</span>
            </span>
          </footer>
        </button>
      </div>

      <div class="preview__row">
        <span class="preview__label">active</span>
        <button type="button" class="course-card is-active" style="--course-accent: #5c6bc0; --course-fg: #fff">
          <span class="course-card__stripe" aria-hidden></span>
          <span class="course-card__surface" aria-hidden></span>
          <header class="course-card__head">
            <span class="course-card__code">PIE200</span>
            <span class="course-card__category">PIE</span>
          </header>
          <p class="course-card__name">Proyecto con Empresa</p>
          <footer class="course-card__foot">
            <span class="course-card__credits">
              <span class="course-card__credits-value">5</span>
              <span class="course-card__credits-label">cr</span>
            </span>
          </footer>
        </button>
      </div>

      <div class="preview__row">
        <span class="preview__label">blocked (prereqs)</span>
        <button type="button" class="course-card course-card--blocked" disabled style="--course-accent: #1565c0; --course-fg: #fff">
          <span class="course-card__stripe" aria-hidden></span>
          <span class="course-card__surface" aria-hidden></span>
          <header class="course-card__head">
            <span class="course-card__code">HAB301</span>
            <span class="course-card__category">HAB</span>
          </header>
          <p class="course-card__name">Comunicación Profesional</p>
          <footer class="course-card__foot">
            <span class="course-card__credits">
              <span class="course-card__credits-value">4</span>
              <span class="course-card__credits-label">cr</span>
            </span>
          </footer>
        </button>
      </div>

      <div class="preview__row">
        <span class="preview__label">beyond horizon</span>
        <button type="button" class="course-card course-card--beyond" disabled style="--course-accent: #b0bec5; --course-fg: #222">
          <span class="course-card__stripe" aria-hidden></span>
          <span class="course-card__surface" aria-hidden></span>
          <header class="course-card__head">
            <span class="course-card__code">EEL400</span>
            <span class="course-card__category">EEL</span>
          </header>
          <p class="course-card__name">Electivo Libre</p>
          <footer class="course-card__foot">
            <span class="course-card__credits">
              <span class="course-card__credits-value">8</span>
              <span class="course-card__credits-label">cr</span>
            </span>
          </footer>
          <span class="course-card__state course-card__state--beyond" aria-hidden>
            <span class="course-card__lock"></span>
          </span>
        </button>
      </div>

      <div class="preview__row">
        <span class="preview__label">approved</span>
        <button type="button" class="course-card course-card--approved" aria-pressed="true" style="--course-accent: #1a237e; --course-fg: #fff">
          <span class="course-card__stripe" aria-hidden></span>
          <span class="course-card__surface" aria-hidden></span>
          <header class="course-card__head">
            <span class="course-card__code">IIT118W</span>
            <span class="course-card__category">IIA</span>
          </header>
          <p class="course-card__name">Taller de Programación</p>
          <footer class="course-card__foot">
            <span class="course-card__credits">
              <span class="course-card__credits-value">10</span>
              <span class="course-card__credits-label">cr</span>
            </span>
          </footer>
          <span class="course-card__ribbon" aria-hidden></span>
        </button>
      </div>
    </div>
  </body>
</html>
